<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tessa Tales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Gochi+Hand&family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="/web/book.css">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>

<header class="top">
  <h1 id="title" class="editable" contenteditable="true" spellcheck="false" title="Tap to rename the book">Coming home</h1>
  <div class="corner">
    <button class="round ghost" id="sound" title="Sound on/off" aria-label="Sound on or off">🔊</button>
  </div>
</header>

<main>
  <div id="moments"></div>
  <section class="pile-link">
    <button id="open-pile" class="pile-btn" title="Marshmallow's pile: everything Olaf buried" aria-label="Open Marshmallow's pile">
      <span class="big">⛄</span><span class="n" id="pile-n"></span>
    </button>
  </section>
</main>

<nav class="strip" aria-label="Your book">
  <div class="book-icon" aria-hidden="true">📖</div>
  <ol class="pages" id="pages"></ol>
  <span class="saved" id="saved" aria-live="polite"></span>
  <button class="tell" id="tell" title="Tell it with Tessa">🎤 Tell it!</button>
</nav>

<dialog id="viewer" aria-label="Picture viewer">
  <button class="round ghost v-close" id="v-close" aria-label="Close">✕</button>
  <div class="v-stage">
    <img id="v-img-a" class="v-img on" alt="">
    <img id="v-img-b" class="v-img" alt="">
    <button class="v-nav prev" id="v-prev" aria-label="Previous picture">‹</button>
    <button class="v-nav next" id="v-next" aria-label="Next picture">›</button>
    <span class="v-count" id="v-count"></span>
  </div>
  <div class="v-bar">
    <div class="react big" id="v-react"></div>
    <div class="v-tools">
      <button class="round" id="v-play" title="Play it slowly" aria-label="Play">▶</button>
      <button class="round" id="v-flip" title="Make this page a flip-book" aria-label="Flip-book page">🎞️</button>
    </div>
  </div>
  <ol class="v-film" id="v-film"></ol>
</dialog>

<dialog id="pile" aria-label="Marshmallow's pile">
  <button class="round ghost v-close" id="pile-close" aria-label="Close">✕</button>
  <div class="pile-head" aria-hidden="true">⛄</div>
  <div class="pile-grid" id="pile-grid"></div>
</dialog>

<div class="undo" id="undo" role="status"><span id="undo-icon">👎</span><button class="round" id="undo-btn" aria-label="Undo">↩️</button></div>

<script src="/web/book.js"></script>
</body>
</html>
