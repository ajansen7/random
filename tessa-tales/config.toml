# Tessa Tales knobs. Tune these against her real SD cards, then re-run:
#   uv run tessa.py sieve <import-id>

# Where her photos and recordings live. Never inside the git repo.
home = "~/TessaTales"

[bursts]
gap_seconds = 20              # a new burst starts after this much quiet
standout_quiet_seconds = 90   # quiet on both sides of a lone photo = she meant it (gold star)
standout_max_photos = 2       # a "lone" moment can be one or two clicks
flipbook_min_photos = 8       # stacks this big can become a flip-book page

[stacks]
# Junk frames are buried before stacking, so gaps here skip over them.
stack_gap_seconds = 90        # kept pictures this close together can stack
same_scene = 0.80             # CLIP similarity needed to keep stacking
same_look_bits = 0            # perceptual-hash shortcut; 0 = off (every blurry picture "looks the same")
merge_gap_seconds = 240       # neighbouring stacks this close...
merge_scene = 0.88            # ...that look this alike become one stack
highlight_same = 0.93         # pictures this alike count as one look in a flip-book
highlight_max = 10            # a flip-book page shows at most this many different pictures

[moments]
gap_minutes = 10              # this long with nothing worth keeping starts a new moment

[sieve]
model = "MobileCLIP2-S2"
pretrained = "dfndr2b"
junk_high = 0.60              # junk score at or above this: snowdrift
junk_low = 0.35               # at or below this: treasure
person_protect = 0.25         # this much "someone's in here" and it can't be buried
too_dark = 18                 # mean brightness out of 255
too_bright = 245
too_flat = 6                  # pixel spread; a thumb over the lens is very flat

[voice]
# Whisper runs on the Mac's GPU (mlx-whisper). Her recording is the real thing; the words are a helper.
model = "mlx-community/whisper-large-v3-turbo"
prompt = "A three-year-old girl tells a story to her dad in short, simple toddler sentences."

[weave]
# How Tessa's picture talk becomes a story (pages, order, title, narrator bridges).
engine = "local"                                       # "local" = free, on the Mac (MLX) | "claude" = API, needs billing
local_model = "mlx-community/Qwen2.5-7B-Instruct-4bit" # ~4 GB, downloaded once
claude_model = "claude-opus-5-5"

[prompts]
# CLIP compares every photo with these little descriptions.
# Tuned on her first real card (2026-11-26): a vague catch-all like "a blurry photo of nothing"
# swallowed real faces on this blurry, yellow-tinted camera, so junk stays specific.
# Plain black, white and blank frames are caught by the brightness rules in [sieve], not here.
junk = [
    "a photo of the inside of a pocket",
    "a completely black photo",
    "a finger covering the camera lens",
    "a photo of a ceiling",
    "a photo of the floor",
    "a photo of carpet",
    "an empty car seat",
    "a dark photo of the inside of a car at night",
    "a photo of a wall",
    "a photo of a door",
    "a light on the ceiling",
    "blurry streaks of light in the dark",
    "a parking lot at night",
    "a blurry smear of color",
    "a bright blurry white blob",
    "a blurry photo of a bed sheet",
]
people = [
