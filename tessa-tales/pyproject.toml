[project]
name = "tessa-tales"
version = "0.1.0"
description = "Turn a toddler's kids-camera photos into storybooks told in her own voice."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4",
    "numpy>=1.26",
    "imagehash>=4.3",
    "torch>=2.4",
    "open_clip_torch>=2.26",
    "timm>=1.0",
    "mlx-whisper>=0.4.3",
    "mlx-lm>=0.32.2",
]

[tool.uv]
package = false
